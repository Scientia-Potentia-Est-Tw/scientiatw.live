{{ define "main" }}

<div class="row-fluid navmargin">
    <div class="page-header">
        <h1>{{ .Title }}</h1>
    </div>
</div>

<div class="row-fluid content-row">
    <div class="span12 bs-docs-sidebar">
        {{ with .Params.description }}<p class="lead">{{ . }}</p>{{ end }}
        <div class="post-content newsletter-embed">
            {{ .Content }}
            {{ partial "mailchimp-embed.html" . }}
        </div>

        <h4 class="post-end-links">
            <a href="{{ "/" | relLangURL }}">{{ i18n "backtohome" }}</a>
        </h4>
    </div>
</div>

<style>
    .newsletter-embed #mc_embed_signup {
        margin-top: 20px;
    }
</style>

{{ end }}
