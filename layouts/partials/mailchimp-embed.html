<!--
    Mailchimp embedded signup form.
    Functionally this is the exact form Mailchimp generated (same action
    URL, field names, hidden bot-trap field, and validation script) — only
    the visuals were changed:
      1. Dropped Mailchimp's own "classic-061523.css" stylesheet. That's
         what was forcing the white panel / black text / blue button —
         it has nothing to do with hugo.386, so it always looked out of
         place next to it.
      2. Replaced it with the small stylesheet below, which uses
         `inherit` / `currentColor` everywhere so the form just picks up
         whatever background, text color, and font the rest of the page
         is already using, instead of fighting it.
      3. Also fixed a stray `false;` token left over in Mailchimp's inline
         style (invalid CSS from their export), made the width responsive,
         and dropped the "Intuit Mailchimp" referral badge — it's a fixed
         white/black image that can't be recolored to match the theme.
-->
<div id="mc_embed_shell">
    <style type="text/css">
        #mc_embed_signup {
            background: transparent;
            color: inherit;
            font: inherit;
            width: 100%;
            max-width: 480px;
            clear: left;
        }
        #mc_embed_signup h2 {
            margin: 0 0 0.5em;
            font-size: 1.3em;
        }
        #mc_embed_signup .indicates-required {
            font-size: 0.85em;
            opacity: 0.75;
            margin-bottom: 1em;
        }
        #mc_embed_signup .asterisk {
            color: inherit;
            opacity: 0.75;
        }
        #mc_embed_signup .mc-field-group {
            margin-bottom: 1em;
        }
        #mc_embed_signup label {
            display: block;
            margin-bottom: 0.3em;
            font-size: 0.9em;
        }
        #mc_embed_signup input[type="email"],
        #mc_embed_signup input[type="text"] {
            box-sizing: border-box;
            width: 100%;
            max-width: 320px;
            padding: 6px 8px;
            background: transparent;
            color: inherit;
            font: inherit;
            border: 1px solid currentColor;
            border-radius: 3px;
            opacity: 0.9;
        }
        #mc_embed_signup input[type="email"]:focus,
        #mc_embed_signup input[type="text"]:focus {
            opacity: 1;
            outline: none;
        }
        #mc_embed_signup .button,
        #mc_embed_signup #mc-embedded-subscribe {
            display: inline-block;
            background: transparent;
            color: inherit;
            font: inherit;
            border: 1px solid currentColor;
            border-radius: 3px;
            padding: 6px 16px;
            cursor: pointer;
            opacity: 0.85;
        }
        #mc_embed_signup .button:hover,
        #mc_embed_signup #mc-embedded-subscribe:hover {
            opacity: 1;
            border-width: 2px;
        }
        #mc_embed_signup #mce-responses .response {
            margin-top: 0.5em;
            font-size: 0.9em;
        }
    </style>
    <div id="mc_embed_signup">
        <form action="https://live.us12.list-manage.com/subscribe/post?u=1cb9611c999051fe721263138&amp;id=4574579802&amp;f_id=00f29fe0f0" method="post" id="mc-embedded-subscribe-form" name="mc-embedded-subscribe-form" class="validate" target="_blank">

                <p><a href="https://us12.campaign-archive.com/home/?u=1cb9611c999051fe721263138&amp;id=4574579802">近期勝報</a></p>
